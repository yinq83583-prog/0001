name: Native Windows x64 build

# Build all already compiles the complete Windows x64 target for every PR head.
# Keep this focused variant manual so it does not duplicate that long dependency build.
on:
  workflow_dispatch:

concurrency:
  group: native-windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows_x64:
    name: Build OrcaSlicer Windows x64
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit
