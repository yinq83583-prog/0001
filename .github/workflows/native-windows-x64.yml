name: Native Windows x64 build

on:
  push:
    branches:
      - feature/painted-surface-layer-time-smooth-v250

concurrency:
  group: native-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows_x64:
    name: Build OrcaSlicer Windows x64
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit
